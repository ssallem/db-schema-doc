<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB 테이블 정의서 생성기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
  }
  header {
    background: #1a237e;
    color: #fff;
    padding: 28px 0;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: .02em; }
  header p  { font-size: .85rem; opacity: .75; margin-top: 6px; }
  .container {
    max-width: 700px;
    margin: 36px auto;
    padding: 0 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    padding: 32px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 1.1rem;
    color: #1a237e;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e8eaf6;
  }
  .form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .form-group.full { flex: 1 1 100%; }
  label {
    font-size: .82rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
  }
  input, select {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: .92rem;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #1a237e;
    box-shadow: 0 0 0 2px rgba(26,35,126,.12);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    font-size: .95rem; color: #888; line-height: 1; padding: 4px;
  }
  .radio-group { display: flex; gap: 20px; padding-top: 4px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
  .radio-group input[type="radio"] { width: auto; accent-color: #1a237e; }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn {
    flex: 1; padding: 12px 20px; border-radius: 8px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
    transition: all .2s; border: 2px solid #1a237e;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { background: #fff; color: #1a237e; }
  .btn-secondary:hover:not(:disabled) { background: #e8eaf6; }
  .btn-primary { background: #1a237e; color: #fff; border-color: #1a237e; }
  .btn-primary:hover:not(:disabled) { background: #0d1561; }
  .status-msg {
    margin-top: 16px; padding: 12px 16px; border-radius: 8px;
    font-size: .88rem; display: none;
  }
  .status-msg.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .status-msg.error   { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .overlay.active { display: flex; }
  .spinner-box {
    background: #fff; border-radius: 16px; padding: 40px 48px;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid #e0e0e0;
    border-top-color: #1a237e; border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-box p { font-size: .95rem; color: #555; }
  .spinner-box .sub { font-size: .8rem; color: #999; margin-top: 6px; }
  footer { text-align: center; padding: 24px; font-size: .78rem; color: #999; }
  footer a { color: #1a237e; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .api-banner {
    text-align: center; padding: 10px; font-size: .82rem;
    background: #fff3e0; color: #e65100; border: 1px solid #ffe082;
    border-radius: 8px; margin-bottom: 24px; display: none;
  }
  @media (max-width: 600px) {
    .form-row { flex-direction: column; gap: 12px; }
    .btn-row  { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>DB 테이블 정의서 생성기</h1>
  <p>데이터베이스 테이블 구조를 엑셀 또는 HTML 문서로 추출합니다</p>
</header>

<div class="container">
  <div id="apiBanner" class="api-banner"></div>

  <form id="schemaForm" autocomplete="off">
    <div class="card">
      <h2>데이터베이스 접속 정보</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="dbType">DB Type</label>
          <select id="dbType" name="db_type" required>
            <option value="oracle" selected>Oracle</option>
            <option value="postgresql">PostgreSQL</option>
          </select>
        </div>
        <div class="form-group">
          <label for="port">Port</label>
          <input type="number" id="port" name="port" placeholder="e.g. 1521" required min="1" max="65535">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="host">Host</label>
          <input type="text" id="host" name="host" placeholder="e.g. db.example.com" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="sid">SID / Database</label>
          <input type="text" id="sid" name="sid" placeholder="e.g. ORCL" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="user">User</label>
          <input type="text" id="user" name="user" placeholder="e.g. scott" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="button" class="pw-toggle" onclick="togglePw()" title="비밀번호 표시/숨김">&#9737;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>출력 설정</h2>
      <div class="form-group">
        <label>Export Format</label>
        <div class="radio-group">
          <label><input type="radio" name="export_format" value="excel" checked> Excel (.xlsx)</label>
          <label><input type="radio" name="export_format" value="html"> HTML</label>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="btnTest" onclick="testConnection()">접속 테스트</button>
        <button type="button" class="btn btn-primary"   id="btnGen"  onclick="generateDoc()">정의서 생성</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </form>
</div>

<div class="overlay" id="overlay">
  <div class="spinner-box">
    <div class="spinner"></div>
    <p>테이블 정의서 생성 중...</p>
    <p class="sub">테이블 550개 이상 처리 시 수십 초 소요될 수 있습니다</p>
  </div>
</div>

<footer>
  DB Schema Document Generator - K-SHIFT
  &nbsp;|&nbsp;
  <a href="https://ai-review-kit.pages.dev">AI Review Kit</a>
</footer>

<script>
// ============================================================
// API Backend URL (Cloudflare Tunnel)
// ssallem.duckdns.org에서 cloudflared tunnel로 노출된 주소
// ============================================================
var API_BASE = 'https://db-schema-api.kviewer.co.kr';

// Page load: check API server connectivity
(async function() {
  try {
    var res = await fetch(API_BASE + '/', { mode: 'cors', signal: AbortSignal.timeout(5000) });
    if (res.ok) document.getElementById('apiBanner').style.display = 'none';
  } catch (e) {
    var b = document.getElementById('apiBanner');
    b.textContent = 'API 서버에 연결할 수 없습니다. 백엔드 서버가 실행 중인지 확인해주세요.';
    b.style.display = 'block';
  }
})();

function togglePw() {
  var inp = document.getElementById('password');
  var btn = inp.nextElementSibling;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '\u2739' : '\u25C9';
}

function showStatus(msg, ok) {
  var el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'success' : 'error');
}

function clearStatus() {
  var el = document.getElementById('statusMsg');
  el.className = 'status-msg';
  el.textContent = '';
}

function getFormData() {
  var form = document.getElementById('schemaForm');
  if (!form.reportValidity()) return null;
  return new FormData(form);
}

function setButtons(disabled) {
  document.getElementById('btnTest').disabled = disabled;
  document.getElementById('btnGen').disabled  = disabled;
}

async function testConnection() {
  var fd = getFormData();
  if (!fd) return;
  clearStatus();
  setButtons(true);
  try {
    var res = await fetch(API_BASE + '/test-connection', { method: 'POST', body: fd });
    if (!res.ok) {
      var err = await res.json().catch(function() { return {}; });
      showStatus(err.detail || 'Server error', false);
      return;
    }
    var data = await res.json();
    showStatus(data.message, data.success);
  } catch (e) {
    showStatus('API 서버에 연결할 수 없습니다.', false);
  } finally {
    setButtons(false);
  }
}

async function generateDoc() {
  var fd = getFormData();
  if (!fd) return;
  clearStatus();
  setButtons(true);
  document.getElementById('overlay').classList.add('active');
  try {
    var res = await fetch(API_BASE + '/generate', { method: 'POST', body: fd });
    if (!res.ok) {
      var err = await res.json().catch(function() { return {}; });
      showStatus(err.detail || 'Server error (' + res.status + ')', false);
      return;
    }
    var ct = res.headers.get('Content-Type') || '';
    if (ct.indexOf('application/json') !== -1) {
      var data = await res.json();
      showStatus(data.detail || data.error || 'Unknown error', false);
      return;
    }
    var disp = res.headers.get('Content-Disposition') || '';
    var match = disp.match(/filename="?([^"]+)"?/);
    // Fallback (e.g. if the server filename header is unreadable cross-origin):
    // pick the extension from the selected format, not a hardcoded .xlsx.
    var sel = document.querySelector('input[name="export_format"]:checked');
    var ext = (sel && sel.value === 'html') ? 'html' : 'xlsx';
    var filename = match ? match[1] : ('table_definition.' + ext);
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showStatus('정의서 생성 완료! 파일이 다운로드됩니다.', true);
  } catch (e) {
    showStatus('API 서버에 연결할 수 없습니다.', false);
  } finally {
    setButtons(false);
    document.getElementById('overlay').classList.remove('active');
  }
}

document.getElementById('dbType').addEventListener('change', function() {
  var sidLabel = document.querySelector('label[for="sid"]');
  var portInput = document.getElementById('port');
  if (this.value === 'postgresql') {
    sidLabel.textContent = 'Database';
    portInput.placeholder = 'e.g. 5432';
  } else {
    sidLabel.textContent = 'SID / Service Name';
    portInput.placeholder = 'e.g. 1521';
  }
});
</script>
</body>
</html>
